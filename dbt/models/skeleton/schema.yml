version: 2

models:
  - name: occurrences
    description: >
      Unified occurrence table merging the staged GBIF and OBIS copies (WoRMS species only).
      Keeps presences only, drops OBIS QC rejects, fossil and living specimens, invalid or
      pre-MIN_YEAR dates, 0/0 coordinates and records less precise than PROXIMITY_METERS, then
      drops GBIF copies of OBIS records (same species, day and location). Partitioned by
      event_date (month) and clustered by geography.
    columns:
      - name: occurrence_key
        description: Source-prefixed native record ID ('gbif:<gbifid>' / 'obis:<OBIS _id>').
        data_tests:
          - unique
          - not_null

      - name: event_date
        description: Timestamp of the observation, used as the partition key (month granularity).
        data_tests:
          - not_null

      - name: species
        description: WoRMS-validated scientific name of the observed species.
        data_tests:
          - not_null
          - relationships:
              to: source('marine_data', 'worms_table')
              field: scientificName

      - name: individual_count
        description: Number of individuals observed; null when not recorded (never coerced to 1). Always > 0 when set.

      - name: coordinate_uncertainty_m
        description: Coordinate uncertainty radius in metres; null when not recorded.

      - name: basis_of_record
        description: Darwin Core basis of record as published (GBIF and OBIS spell it differently).

      - name: geography
        description: Point geometry of the observation, used as the clustering key.
        data_tests:
          - not_null

      - name: source
        description: Data provenance tag indicating which upstream dataset the row came from.
        data_tests:
          - not_null
          - accepted_values:
              values: ['GBIF', 'OBIS']

  - name: species
    description: >
      Deduplicated species reference table built from occurrences. Flags each species
      as endangered (IUCN Red List), invasive (GISD), or normal via LEFT JOINs. Enrichment
      data (common_name, description, image_url) lives in the separate species_enrichment
      table managed by the enrichment pipeline.
    columns:
      - name: species
        description: Unique scientific name. Primary key for this table.
        data_tests:
          - not_null
          - unique

      - name: is_endangered
        description: TRUE if the species appears on the IUCN Red List.
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

      - name: is_invasive
        description: TRUE if the species appears in the Global Invasive Species Database.
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

      - name: species_type
        description: >
          Classification label derived from conservation status. Endangered takes priority
          over invasive if a species appears in both lists.
        data_tests:
          - not_null
          - accepted_values:
              values: ['endangered', 'invasive', 'normal']
