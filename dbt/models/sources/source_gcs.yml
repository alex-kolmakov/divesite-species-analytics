version: 2

sources:
  - name: marine_data
    description: >
      External GCS parquet files and BigQuery tables that back the marine species analytics
      platform. Ingested by the marine-data-ingestion Cloud Run job.
    database: gbif-412615
    loader: gcloud storage

    tables:
      - name: obis_table
        description: >
          Ocean Biogeographic Information System occurrence records. Refreshed from
          s3://obis-open-data via the ingestion pipeline, flattened from the interpreted struct.
          Every record with a species and coordinates is kept, including absences and rows OBIS
          QC dropped; filtering happens in obis_occurrences so each rule can be counted.
        external:
          location: 'gs://marine_data_412615/obis.parquet'
          options:
            format: parquet
        columns:
          - name: obis_id
            description: OBIS's own unique record ID (`_id`).
          - name: dataset_id
            description: OBIS dataset UUID.
          - name: occurrenceID
            description: Publisher's occurrence ID. With the dataset, matches copies of the record in GBIF.
          - name: species
            description: Scientific name of the observed species.
          - name: decimalLatitude
            description: Latitude of the observation in decimal degrees.
          - name: decimalLongitude
            description: Longitude of the observation in decimal degrees.
          - name: coordinateUncertaintyInMeters
            description: Coordinate uncertainty radius in metres (mostly null).
          - name: eventDate
            description: >
              Free-text date as published. Not used: contains unparseable or impossible values
              ('0000-00-00', '3798-06-28') that OBIS itself rejected.
          - name: date_start
            description: OBIS-validated start of the event, epoch milliseconds. Null when the date is invalid.
          - name: date_mid
            description: OBIS-validated midpoint of the event, epoch milliseconds. Null when the date is invalid.
          - name: date_end
            description: OBIS-validated end of the event, epoch milliseconds. Null when the date is invalid.
          - name: date_year
            description: OBIS-validated year. Null when the date is invalid.
          - name: individualCount
            description: Number of individuals observed, as a string (may be null).
          - name: basisOfRecord
            description: Darwin Core basis of record (HumanObservation, PreservedSpecimen, MaterialSample, ...).
          - name: absence
            description: True when the record says the species was looked for and not found.
          - name: dropped
            description: True when OBIS quality control rejected the record (on land, not marine, no coordinates).
          - name: flags
            description: Comma-separated OBIS quality flags (NO_DEPTH, ON_LAND, DEPTH_EXCEEDS_BATH, ...); null when none.

      - name: worms_table
        description: >
          World Register of Marine Species taxonomy extract. Used as the authoritative
          species validation reference. Joined on scientificName to filter occurrences.
        external:
          location: 'gs://marine_data_412615/worms.parquet'
          options:
            format: parquet
        columns:
          - name: scientificName
            description: Accepted scientific name from WoRMS taxonomy.

      - name: redlist_table
        description: >
          IUCN Red List of Threatened Species extract. Used to flag species as endangered
          in the species reference table.
        external:
          location: 'gs://marine_data_412615/redlist.parquet'
          options:
            format: parquet
        columns:
          - name: scientificName
            description: Scientific name of the species on the IUCN Red List.

      - name: invasive_table
        description: >
          Global Invasive Species Database (GISD) extract. Used to flag species as invasive
          in the species reference table.
        external:
          location: 'gs://marine_data_412615/invasive.parquet'
          options:
            format: parquet
        columns:
          - name: scientificName
            description: Scientific name of the invasive species.

      - name: divesites_padi_table
        description: >
          PADI dive site locations scraped from the dive-guide API. ~3,400 sites worldwide.
          Supplementary source — SSI is primary. PADI fills ~2,700 locations not in SSI.
          Schema auto-detected from Parquet (title, latitude, longitude + PADI internal fields).
        external:
          location: 'gs://marine_data_412615/divesites.parquet'
          options:
            format: parquet

      - name: divesites_ssi_table
        description: >
          SSI (Scuba Schools International) dive site locations scraped from divessi.com.
          ~10,600 sites worldwide with full community metrics. Primary dive site source —
          3× more sites than PADI, with depth, visibility, ratings, and logged dive counts.
          Schema auto-detected from Parquet (id, name, lat, lng, country_iso3, averageMaxDepth,
          averageDivetime, averageVis, averageRating, loggedDives, level, wildlife,
          description1, description2, URL, dcAffiliated, images).
        external:
          location: 'gs://marine_data_412615/ssi_divesites.parquet'
          options:
            format: parquet

      - name: species_enrichment
        description: >
          Species enrichment data populated by the enrichment pipeline (not managed by dbt).
          Contains common names (GBIF API), descriptions (Wikipedia), and images
          (Wikipedia/Wikidata). Survives dbt rebuilds since it lives outside the dbt DAG.
        columns:
          - name: species
            description: Scientific name (foreign key to species table).
          - name: common_name
            description: English common name from GBIF vernacular names API.
          - name: description
            description: Species description from Wikipedia REST API (first paragraph).
          - name: image_url
            description: Direct image URL from Wikipedia or Wikimedia Commons.
