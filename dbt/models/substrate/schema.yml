version: 2

models:
  - name: gbif_occurrences
    description: >
      Staged copy of the GBIF BigQuery public dataset, WoRMS species only. Built by the one query
      that scans GBIF (~306 GiB, the table has no partitioning); everything downstream reads this
      table. No quality filter is applied here: absences, basis of record, uncertainty and dates
      are filtered in occurrences. In dev mode, uses TABLESAMPLE SYSTEM (0.01%).
    columns:
      - name: gbif_id
        description: GBIF's record ID (gbifid).
        data_tests:
          - unique
          - not_null

      - name: species
        description: Scientific name of the observed species (present in WoRMS).
        data_tests:
          - not_null

      - name: individualcount
        description: Number of individuals as published; null when not recorded.

      - name: eventdate
        description: Timestamp of the observation event; may be null.

      - name: decimallongitude
        description: Longitude in decimal degrees; may be null.

      - name: decimallatitude
        description: Latitude in decimal degrees; may be null.

      - name: coordinate_uncertainty_m
        description: Coordinate uncertainty radius in metres; mostly null.

      - name: occurrence_status
        description: PRESENT or ABSENT.

      - name: basis_of_record
        description: Darwin Core basis of record (HUMAN_OBSERVATION, PRESERVED_SPECIMEN, FOSSIL_SPECIMEN, ...).

  - name: obis_occurrences
    description: >
      Staged copy of the OBIS GCS parquet, WoRMS species only (~50 GiB read, once per re-ingest).
      No quality filter is applied here: absence, OBIS QC drops and invalid dates are filtered in
      occurrences. In dev mode, applies a deterministic 1% hash-based sample on species.
    columns:
      - name: obis_id
        description: OBIS's unique record ID.
        data_tests:
          - unique
          - not_null

      - name: dataset_id
        description: OBIS dataset UUID.
        data_tests:
          - not_null

      - name: species
        description: Scientific name of the observed species (present in WoRMS).
        data_tests:
          - not_null

      - name: individualcount
        description: Number of individuals as published (string); null when not recorded.

      - name: date_mid
        description: OBIS-validated event midpoint, epoch milliseconds; null when OBIS could not parse the date.

      - name: decimallongitude
        description: Longitude in decimal degrees.
        data_tests:
          - not_null

      - name: decimallatitude
        description: Latitude in decimal degrees.
        data_tests:
          - not_null

      - name: coordinate_uncertainty_m
        description: Coordinate uncertainty radius in metres; mostly null.

      - name: basis_of_record
        description: Darwin Core basis of record (HumanObservation, PreservedSpecimen, ...).

      - name: absence
        description: True when the species was looked for and not found.

      - name: dropped
        description: True when OBIS quality control rejected the record (on land, not marine, ...).

      - name: flags
        description: Comma-separated OBIS quality flags; null when none.

  - name: divesites
    description: >
      Materialized table of all dive site locations. SSI is the primary source (~10,600 sites);
      PADI supplements with ~2,700 sites not present in SSI. A PADI site is dropped as a duplicate
      when an SSI site lies within 500 m with a matching name, or within 25 m regardless of name.
      Sites within one source are never merged. Clustered by geography for efficient spatial
      joins downstream.
    columns:
      - name: site_id
        description: >
          Stable site key, '<source>:<source id>' (e.g. 'ssi:1234', 'padi:5678'). Use this, not
          title, to join or look up sites: titles repeat worldwide.
        data_tests:
          - unique
          - not_null

      - name: title
        description: Human-readable name of the dive site. Not globally unique — sites worldwide may share names.
        data_tests:
          - not_null

      - name: geography
        description: Point geometry of the dive site derived from longitude/latitude.
        data_tests:
          - not_null

      - name: latitude
        description: Latitude in decimal degrees.
        data_tests:
          - not_null

      - name: longitude
        description: Longitude in decimal degrees.
        data_tests:
          - not_null

      - name: site_source
        description: Origin of the site record — 'ssi' or 'padi'.
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssi', 'padi']

      - name: country_iso3
        description: ISO 3166-1 alpha-3 country code (SSI sites only; null for PADI-only sites).

      - name: avg_max_depth
        description: Community average maximum depth in metres (SSI only).

      - name: avg_divetime
        description: Community average dive time in minutes (SSI only).

      - name: avg_visibility
        description: Community average visibility in metres (SSI only).

      - name: avg_rating
        description: Community average rating on a 1–5 scale (SSI only).

      - name: logged_dives
        description: Total dives logged at this site by SSI users. Proxy for site popularity (SSI only).

  - name: wrims_regions
    description: Marine Regions areas used by WRiMS, as GEOGRAPHY (boundaries simplified to ~1 km at ingest).
    columns:
      - name: mrgid
        description: Marine Regions ID.
        data_tests:
          - unique
          - not_null
      - name: geography
        description: Area boundary.
        data_tests:
          - not_null
