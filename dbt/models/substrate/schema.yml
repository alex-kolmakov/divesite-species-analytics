version: 2

models:
  - name: gbif_occurrences
    description: >
      Staged view over the GBIF (Global Biodiversity Information Facility) BigQuery public dataset.
      Selects species, individual count, event date, and geography. Filters out rows missing
      coordinates, dates, or species. In dev mode, uses TABLESAMPLE SYSTEM (0.01%) to minimise
      bytes scanned.
    columns:
      - name: species
        description: Scientific name of the observed species.
        data_tests:
          - not_null

      - name: individualcount
        description: Number of individuals observed (defaults to 1 when null in source).
        data_tests:
          - not_null

      - name: eventdate
        description: Timestamp of the observation event.
        data_tests:
          - not_null

      - name: geography
        description: Point geometry derived from decimal longitude/latitude via ST_GEOGPOINT.
        data_tests:
          - not_null

  - name: obis_occurrences
    description: >
      Staged view over the OBIS (Ocean Biogeographic Information System) GCS parquet file.
      Dates come from OBIS's validated date_mid, not the free-text eventDate. Excludes absence
      records and rows OBIS quality control dropped. In dev mode, applies a deterministic 1%
      hash-based sample on species (FARM_FINGERPRINT) to avoid full table scans.
    columns:
      - name: obis_id
        description: OBIS's unique record ID.
        data_tests:
          - unique
          - not_null

      - name: dataset_id
        description: OBIS dataset UUID.
        data_tests:
          - not_null

      - name: occurrence_id
        description: Publisher's occurrence ID; with dataset_id, identifies copies of the record in GBIF.

      - name: coordinate_uncertainty_m
        description: Coordinate uncertainty radius in metres (mostly null). Not filtered yet.

      - name: basis_of_record
        description: Darwin Core basis of record. Not filtered yet.

      - name: flags
        description: Comma-separated OBIS quality flags; null when none.

      - name: species
        description: Scientific name of the observed species.
        data_tests:
          - not_null

      - name: individualcount
        description: Number of individuals observed (defaults to 1 when null in source).
        data_tests:
          - not_null

      - name: eventdate
        description: Midpoint of the observation event, from OBIS's validated date_mid.
        data_tests:
          - not_null

      - name: geography
        description: Point geometry derived from decimal longitude/latitude via ST_GEOGPOINT.
        data_tests:
          - not_null

  - name: divesites
    description: >
      Materialized table of all dive site locations. SSI is the primary source (~10,600 sites);
      PADI supplements with ~2,700 sites not present in SSI. A PADI site is dropped as a duplicate
      when an SSI site lies within 500 m with a matching name, or within 25 m regardless of name.
      Sites within one source are never merged. Clustered by geography for efficient spatial
      joins downstream.
    columns:
      - name: site_id
        description: >
          Stable site key, '<source>:<source id>' (e.g. 'ssi:1234', 'padi:5678'). Use this, not
          title, to join or look up sites: titles repeat worldwide.
        data_tests:
          - unique
          - not_null

      - name: title
        description: Human-readable name of the dive site. Not globally unique — sites worldwide may share names.
        data_tests:
          - not_null

      - name: geography
        description: Point geometry of the dive site derived from longitude/latitude.
        data_tests:
          - not_null

      - name: latitude
        description: Latitude in decimal degrees.
        data_tests:
          - not_null

      - name: longitude
        description: Longitude in decimal degrees.
        data_tests:
          - not_null

      - name: site_source
        description: Origin of the site record — 'ssi' or 'padi'.
        data_tests:
          - not_null
          - accepted_values:
              values: ['ssi', 'padi']

      - name: country_iso3
        description: ISO 3166-1 alpha-3 country code (SSI sites only; null for PADI-only sites).

      - name: avg_max_depth
        description: Community average maximum depth in metres (SSI only).

      - name: avg_divetime
        description: Community average dive time in minutes (SSI only).

      - name: avg_visibility
        description: Community average visibility in metres (SSI only).

      - name: avg_rating
        description: Community average rating on a 1–5 scale (SSI only).

      - name: logged_dives
        description: Total dives logged at this site by SSI users. Proxy for site popularity (SSI only).
